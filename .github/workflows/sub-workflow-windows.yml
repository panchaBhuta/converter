name: Windows

on:
  workflow_call: # This makes the workflow reusable
    #inputs:
    #  compiler:
    #    required: true
    #    type: string
    # also refer https://jurajsim.hashnode.dev/a-comparison-of-calling-vs-dispatching-workflows-in-github-actions

  workflow_dispatch:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
    # To enable a workflow to be triggered manually, you need to configure the workflow_dispatch event

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

#env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  #BUILD_TYPE: Release


#defaults:
#  run:
#    shell: cmd

jobs:
  build-windows:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        # https://github.com/actions/runner-images#available-images
        # https://github.com/actions/runner-images/tree/main/images/windows
        # https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories  (os-labels : windows-2022)
        # https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#preinstalled-software-for-github-owned-images
        # NOTE: verify these labels exist as GitHub-hosted runners before relying on them;
        #       an unknown label leaves the job queued forever instead of failing fast.
        os-generator: [ { os: windows-2025-vs2026,   generator: "Visual Studio 18 2026", arch: x64   },
                        { os: windows-2022,          generator: "Visual Studio 17 2022", arch: x64   },
                        { os: windows-11-vs2026-arm, generator: "Visual Studio 18 2026", arch: ARM64 } ] #, windows-2019]
        # https://cmake.org/cmake/help/latest/manual/cmake.1.html#cmdoption-cmake-T
        # CMake compiler option doesn't work for Visual Studio project :: https://youtrack.jetbrains.com/issue/CPP-17314
        # https://github.com/actions/runner-images/blob/main/images/win/Windows2022-Readme.md#tools
        # https://stackoverflow.com/questions/66025220/paired-values-in-github-actions-matrix
          # default == 'MSVC 19'
          # g++-11  == 'MSVC 19'
          # g++-12  == 'MSVC 19'
          # g++-13  == 'MSVC 19'
          # clang   == 'MSVC 19'
          # ClangCl == 'Clang 16'
        toolset_compiler: [ { compiler: default, cmdShell: cmd,         rawCompiler: cl.exe,  compilerMacros: "echo msbuild_does_not_support" },    #  microsoft/setup-msbuild@v2
                                #    on more details on  msbuild not supporting "-dM' option, refer https://stackoverflow.com/questions/4239993/determining-endianness-at-compile-time

                            { compiler: ClangCl, cmdShell: cmd,         rawCompiler: clang++, compilerMacros: "clang++  -dM -E -x c++ NUL:"   },    #  microsoft/setup-msbuild@v2
                                # https://github.com/ArchieAtkinson/CppTemplate
                                # https://github.com/scikit-build/scikit-build-core/blob/main/.github/workflows/ci.yml

                            { compiler: g++,     cmdShell: "msys2 {0}", rawCompiler: g++,     compilerMacros: "g++  -dM -E -x c++ /dev/null"  } ]   #  msys2/setup-msys2@v2
        #include:
        #  - os: windows-2019
        #      # ClangCl == 'Clang 12'
        #    toolset_compiler : { compiler: ClangCl, toolset: 1 }
    runs-on: ${{matrix.os-generator.os}}
    timeout-minutes: 15
    outputs:
      run-id: ${{ github.run_id }}

    defaults:
      run:
        #  msys2 shell when using g++ else cmd
        shell: ${{ matrix.toolset_compiler.cmdShell }}

    steps:
      - name: Setup msbuild
        if: matrix.toolset_compiler.compiler != 'g++'    #  cmdShell: cmd
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: ${{ matrix.os-generator.arch }}

      - name: Setup MSVC dev environment (for cl.exe / clang-cl on PATH)
        if: matrix.toolset_compiler.compiler != 'g++'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.os-generator.arch }}

      - name : Setup msys2
        if: matrix.toolset_compiler.compiler == 'g++'    #  cmdShell: "msys2 {0}"
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: minimal
          update: true
          install: >-
            base-devel git
          pacboy: >-
            python:p python-pip:p gcc:p cmake:p ninja:p

      - name: Compiler Version (compiler=default[cl.exe] OR ClangCl)    -   cmdShell( cmd )
        if: matrix.toolset_compiler.compiler != 'g++'
        run: |
          echo cl.exe --version
          cl
          echo clang++ --version
          clang++ --version

      - name: Compiler Version  (compiler=g++)     -   cmdShell( "msys2 {0}" )
        if: matrix.toolset_compiler.compiler == 'g++'
        run: echo "${{ matrix.toolset_compiler.rawCompiler }} --version"; ${{ matrix.toolset_compiler.rawCompiler }} --version

      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Get Version
        # bash (Git Bash) for cl.exe/ClangCl jobs, msys2 shell for the g++ job -
        # both understand uname/egrep/pipes, unlike the default cmd shell.
        shell: ${{ matrix.toolset_compiler.compiler == 'g++' && 'msys2 {0}' || 'bash' }}
        run: |
          uname -a
          echo "------------"
          cmake --version
          echo "------------"
          if [ "${{ matrix.toolset_compiler.compiler }}" != "default" ]; then
            ${{ matrix.toolset_compiler.compilerMacros }} | egrep -i "(apple|mach|gnu|clang|llvm|linux|WIN|version|major|minor)"
          fi

      - name: Check Generators
        # https://stackoverflow.com/questions/25941536/what-is-a-cmake-generator
        run: cmake --help

      - name: Compiler Macros Available
        run: ${{ matrix.toolset_compiler.compilerMacros }}
      #- name: Check mingw64-binaries
        #run: ls -l /mnt/c/msys64/mingw64/bin && echo "##### 'whereis g++'" && whereis g++ && "##### 'g++ --version'" && g++ --version
        #run: echo "##### 'where g++'" && where g++
        #shell: cmd
        #run: where gcc
      #- name: Set g++ to env-PATH
        #                          refer -> https://github.com/msys2/setup-msys2/issues/104
        #run: echo "PATH=$PATH:C:\msys64\mingw64\bin" >> $GITHUB_ENV

      - name: Configure CMake (compiler=default) [Debug]
        # https://hungvu.tech/advanced-github-actions-conditional-workflow
        # https://samanpavel.medium.com/github-actions-conditional-job-execution-e6aa363d2867
        # https://docs.github.com/en/actions/learn-github-actions/expressions
        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idif
        if: matrix.toolset_compiler.compiler == 'default'
        run: |
          cmake --log-level=TRACE -G "${{ matrix.os-generator.generator }}" -A ${{ matrix.os-generator.arch }} -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-debug" -DCONVERTER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Configure CMake (compiler=g++) [Debug]
        if: matrix.toolset_compiler.compiler == 'g++'
        run: |
          cmake -G "${{ matrix.os-generator.generatorCC }}" -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-debug" -DCONVERTER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.toolset_compiler.compiler }}

      - name: Configure CMake (compiler=ClangCl) [Debug]
        # https://cmake.org/cmake/help/latest/guide/user-interaction/index.html
        if: matrix.toolset_compiler.compiler == 'ClangCl'
        run: |
          cmake --log-level=TRACE -G "${{ matrix.os-generator.generator }}" -A ${{ matrix.os-generator.arch }} -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-debug" -DCONVERTER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug -T "${{ matrix.toolset_compiler.compiler }}"

      - name: Check Work-Around-Flags
        shell: ${{ matrix.toolset_compiler.compiler == 'g++' && 'msys2 {0}' || 'bash' }}
        run: |
          grep define "${{ github.workspace }}/build-debug/include/converter/_workaroundConfig.h" | grep -v -e "^//" -e " e_[^ ]*_FEATURE "
          FLAG_DIR="${{ github.workspace }}/build-debug/workAroundFlags"
          mkdir -p ${FLAG_DIR}
          FLAG_FILE="${FLAG_DIR}/flag-${{ matrix.os-generator.os }}-${{ matrix.toolset_compiler.compiler }}.csv"
          echo "_OS,compiler,"$(grep "#define"  "${{ github.workspace }}/build-debug/include/converter/_workaroundConfig.h" | sed "s/  */ /g" | cut -d' ' -f2,3 | grep -e "^SUPPORTED_" -e "^HAS_" -e "^ENABLE_" | cut -d' ' -f1 | tr '\n' ',' | sed 's/,$/\n/g')  >  "${FLAG_FILE}"
          echo "${{ matrix.os-generator.os }},${{ matrix.toolset_compiler.compiler }},"$(grep "#define"  "${{ github.workspace }}/build-debug/include/converter/_workaroundConfig.h" | sed "s/  */ /g" | cut -d' ' -f2,3 | grep -e "^SUPPORTED_" -e "^HAS_" -e "^ENABLE_" | cut -d' ' -f2 | tr '\n' ',' | sed 's/,$/\n/g')  >>  "${FLAG_FILE}"
          cat "${FLAG_FILE}"

      - name: Upload Artifact from Sub-Workflow
        uses: actions/upload-artifact@v4
        with:
          name: "artifact-${{ matrix.os-generator.os }}-${{ matrix.toolset_compiler.compiler }}"
          path: "build-debug/workAroundFlags/flag-${{ matrix.os-generator.os }}-${{ matrix.toolset_compiler.compiler }}.csv"
          if-no-files-found: error

      - name: Build compiler == cl.exe OR ClangCl [Debug]
        if: matrix.toolset_compiler.cmdShell == 'cmd'
        #  https://learn.microsoft.com/en-us/visualstudio/msbuild/msbuild-command-line-reference?view=vs-2022
        run: cmake --build "${{ github.workspace }}/build-debug" --config Debug -j %NUMBER_OF_PROCESSORS%   -- -m -nologo -verbosity:normal

      - name: Build compiler == g++ [Debug]
        if: matrix.toolset_compiler.compiler == 'g++'
        run: cmake --build "${{ github.workspace }}/build-debug" --config Debug -j$(nproc)

      - name: Test [Debug]
        working-directory: ${{ github.workspace }}/build-debug
        #run: ctest -C Debug --output-on-failure -j
        run: ctest -C Debug --verbose

      - name: Install [Debug]
        run: cmake --install "${{ github.workspace }}/build-debug" --config Debug

      - name: Configure CMake (compiler=default) [Release]
        if: matrix.toolset_compiler.compiler == 'default'
        run: |
          cmake -G "${{ matrix.os-generator.generator }}" -A ${{ matrix.os-generator.arch }} -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-release" -DCONVERTER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (compiler=g++) [Release]
        if: matrix.toolset_compiler.compiler == 'g++'
        run: |
          cmake -G "${{ matrix.os-generator.generatorGCC }}" -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-release" -DCONVERTER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.toolset_compiler.compiler }}

      - name: Configure CMake (compiler=ClangCl) [Release]
        if: matrix.toolset_compiler.compiler == 'ClangCl'
        run: |
          cmake -G "${{ matrix.os-generator.generator }}" -A ${{ matrix.os-generator.arch }} -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-release" -DCONVERTER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -T "${{ matrix.toolset_compiler.compiler }}"

      - name: Build compiler == cl.exe OR ClangCl [Release]
        if: matrix.toolset_compiler.cmdShell == 'cmd'
        run: cmake --build "${{ github.workspace }}/build-release" --config Release -j %NUMBER_OF_PROCESSORS%   -- -m -nologo -verbosity:normal

      - name: Build compiler == g++ [Release]
        if: matrix.toolset_compiler.compiler == 'g++'
        run: cmake --build "${{ github.workspace }}/build-release" --config Release -j$(nproc)

      - name: Test [Release]
        working-directory: ${{ github.workspace }}/build-release
        run: ctest -C Release --verbose

      - name: Install [Release]
        run: cmake --install "${{ github.workspace }}/build-release" --config Release

