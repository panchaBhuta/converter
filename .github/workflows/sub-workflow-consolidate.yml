name: Consolidate and Push

on:
  workflow_call: # This makes the workflow reusable
    #inputs:
    #  compiler:
    #    required: true
    #    type: string
    # also refer https://jurajsim.hashnode.dev/a-comparison-of-calling-vs-dispatching-workflows-in-github-actions

  workflow_dispatch:
    # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#workflow_dispatch
    # To enable a workflow to be triggered manually, you need to configure the workflow_dispatch event


#env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  #BUILD_TYPE: Release


defaults:
  run:
    shell: bash

jobs:
  # Consolidate job - downloads artifacts from each sub-workflow's run
  consolidate-buildFlags:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial for pushing changes back to github remote repository



    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetches full history so git can switch and track branches safely


      - name: Checkout automation branch
        run: |
          PR_BRANCH="automation/build-flags"

          # 1. Configure Git using the standard GitHub Actions bot identity
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 2. Safely switch to the PR branch (create it locally if it only exists remotely, or create from scratch)
          git fetch origin

          if git show-ref --verify --quiet "refs/remotes/origin/${PR_BRANCH}"; then
            echo "Branch exists on remote. Checking it out..."
            git checkout -b "${PR_BRANCH}" "origin/${PR_BRANCH}"

            echo "Syncing PR branch with latest changes from main..."
            git merge origin/main --no-edit
          else
            echo "Branch does not exist. Creating a new one from main..."
            git checkout -b "${PR_BRANCH}" origin/main
          fi

      - name: Create Work-Around-Flags Directory
        run: |
          FLAG_DIR="${{github.workspace}}/build-debug/workAroundFlags"
          # FLAG_DIR also used for check_template_template_parameter_output.txt; refer converter-capabilities.cmake
          mkdir -p ${FLAG_DIR}


      - name: Install dos2unix
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix


      # Download artifacts from all sub-workflow runs
      - name: Download Sub-Workflow Artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: artifact-*
          path: build-debug/workAroundFlags/
          merge-multiple: true


      - name: List Downloaded Flag Artifacts
        run: |
          shopt -s nullglob
          files=("${{github.workspace}}/build-debug/workAroundFlags/flag-"*.csv)
          echo "Artifacts Flag downloaded: ${#files[@]}"
          printf '%s\\n' "${files[@]}"

      - name: Consolidate Flag Artifacts and Merge
        run: |
          # Enable nullglob so an unmatched glob expands to nothing instead of the literal pattern
          shopt -s nullglob
          files=("${{github.workspace}}/build-debug/workAroundFlags/flag-"*.csv)

          if ((${#files[@]} == 0)); then
            echo "ERROR: No workAroundFlags CSV files found."
            exit 1
          fi

          # Normalize Windows CRLF line endings before sorting
          dos2unix "${files[@]}" || {
            echo "ERROR: Failed to normalize workAroundFlags files."
            exit 1
          }
	  sed -i 's/\r//' "${files[@]}"

          OUTPUT_FILE="${{github.workspace}}/doc/github/runnerResults/consolidateWorkAroundFlags.csv"

          # sort and deduplicate.
          LC_ALL=C sort -u "${files[@]}" > "${OUTPUT_FILE}"

          # Verify that no CR characters remain.
          if LC_ALL=C grep -n $'\r' "${OUTPUT_FILE}"; then
              echo "ERROR: CR characters remain in consolidated WorkAroundFlags CSV."
              exit 1
          fi

          cat "${OUTPUT_FILE}"


      - name: List Downloaded TTP Artifacts
        run: |
          shopt -s nullglob
          files=("${{github.workspace}}/build-debug/workAroundFlags/diagnostic-TTP-"*.csv)
          echo "Artifacts TTP downloaded: ${#files[@]}"
          printf '%s\\n' "${files[@]}"

      - name: Consolidate TTP Artifacts and Merge
        run: |
          # Enable nullglob so an unmatched glob expands to nothing instead of the literal pattern
          shopt -s nullglob
          files=("${{github.workspace}}/build-debug/workAroundFlags/diagnostic-TTP-"*.csv)

          if ((${#files[@]} == 0)); then
            echo "ERROR: No Template-Template-Parameter diagnostic CSV files found."
            exit 1
          fi

          # Normalize Windows CRLF line endings before sorting
          dos2unix "${files[@]}" || {
            echo "ERROR: Failed to normalize TTP diagnostic files."
            exit 1
          }
	  sed -i 's/\r//' "${files[@]}"

          OUTPUT_FILE="${{github.workspace}}/doc/github/runnerResults/consolidateDiagnosticTTP.csv"

          # sort and deduplicate.
          LC_ALL=C sort -u "${files[@]}" > "${OUTPUT_FILE}"

          # Verify that no CR characters remain.
          if LC_ALL=C grep -n $'\r' "${OUTPUT_FILE}"; then
              echo "ERROR: CR characters remain in consolidated TTP CSV."
              exit 1
          fi

          cat "${OUTPUT_FILE}"


      - name: List Downloaded NaN-Infinity Artifacts
        run: |
          shopt -s nullglob
          files=("${{github.workspace}}/build-debug/workAroundFlags/diagnostic-NAN-INF-"*.csv)
          echo "Artifacts NAN-INF downloaded: ${#files[@]}"
          printf '%s\\n' "${files[@]}"

      - name: Consolidate NAN-INF Artifacts and Merge
        run: |
          # Enable nullglob so an unmatched glob expands to nothing instead of the literal pattern
          shopt -s nullglob
          files=("${{github.workspace}}/build-debug/workAroundFlags/diagnostic-NAN-INF-"*.csv)

          if ((${#files[@]} == 0)); then
            echo "ERROR: No NAN-INF diagnostic CSV files found."
            exit 1
          fi

          # Normalize Windows CRLF line endings before sorting
          dos2unix "${files[@]}" || {
            echo "ERROR: Failed to normalize NAN-INF diagnostic files."
            exit 1
          }
	  sed -i 's/\r//' "${files[@]}"

          OUTPUT_FILE="${{github.workspace}}/doc/github/runnerResults/consolidateDiagnosticNAN-INF.csv"

          # sort and deduplicate.
          LC_ALL=C sort -u "${files[@]}" > "${OUTPUT_FILE}"

          # Verify that no CR characters remain.
          if LC_ALL=C grep -n $'\r' "${OUTPUT_FILE}"; then
              echo "ERROR: CR characters remain in consolidated NAN-INF CSV."
              exit 1
          fi

          cat "${OUTPUT_FILE}"

 



      - name: GIT Commit and Push Changes
        run: |
          PR_BRANCH="automation/build-flags"
          TARGET_FLAGS_FILE="${{github.workspace}}/doc/github/runnerResults/consolidateWorkAroundFlags.csv"
          TARGET_TTP_FILE="${{github.workspace}}/doc/github/runnerResults/consolidateDiagnosticTTP.csv"
          TARGET_NAN_INF_FILE="${{github.workspace}}/doc/github/runnerResults/consolidateDiagnosticNAN-INF.csv"

          git add ${TARGET_FLAGS_FILE} ${TARGET_TTP_FILE} ${TARGET_NAN_INF_FILE}

          # Only commit and push if there are actual changes to prevent workflow errors
          if ! git diff --cached --quiet; then
            git commit -m "chore: automatically update consolidateWorkAroundFlags.csv and consolidateDiagnosticTTP.csv [skip ci]"
            git push origin "${PR_BRANCH}"
          else
            echo "No changes detected. Skipping commit."
          fi
